version: 2.1

orbs:
  newman: postman/newman@1.0.0

jobs:          
    testrail-service-demo:
        description: Run Postman collection tests 
        parameters:
          collection:
            type: string
          temp:
            type: string
        executor: newman/postman-newman-docker
        
        steps:
          - checkout 
          - run:
              name: Installing htmlextra reporting plugin
              command: |
                npm install -g newman-reporter-htmlextra newman-reporter-testrail          
          - run:          
              name: Executing the collection tests for checking TestRail Integration
              command: |
                npx newman run Practice.postman_collection.json -r testrail,cli,htmlextra TESTRAIL_DOMAIN=${TESTRAIL_DOMAIN} TESTRAIL_USERNAME=${TESTRAIL_USERNAME} TESTRAIL_APIKEY=${TESTRAIL_APIKEY} TESTRAIL_PROJECTID="21" TESTRAIL_TITLE="Demo-API Run" --reporter-htmlextra-export ~/project/newman/report.html  
          - store_artifacts: {path: ~/project}
          - store_test_results: {path: /root/project/newman}

workflows:
  qe-guild-api-automation:
    jobs:      
      - testrail-service-demo:
          name: ERS Demo
          collection: 27218141-242b1743-d251-4ab9-a0fd-24102d0622fb
          temp: "Automated Run: $( date '+%F_%H:%M:%S' )"
          context:
            - postman
            - testrail
      